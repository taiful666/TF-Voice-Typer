# Builds the TF Voice Typer Android app (APK) on GitHub's servers.
# Runs by itself on every change, or by hand from the Actions tab ("Run workflow").
# The finished APK is put on the Releases page (tag: latest).
#
# Signing:
#  - Permanent key (optional, later): add repository secrets TF_KEYSTORE_BASE64 + TF_KEY_PASSWORD
#    (+ TF_KEY_ALIAS if not "tfvoicetyper"). See README.
#  - Otherwise a temporary TEST key is used. It lives only in GitHub's private build cache,
#    never in the repository.
name: Build TF Voice Typer APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: tf-voice-typer-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Permanent signing key (only if the secrets exist)
        env:
          KS_B64: ${{ secrets.TF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/permanent.jks"
            echo "TF_KEYSTORE=$RUNNER_TEMP/permanent.jks" >> "$GITHUB_ENV"
            echo "Using the permanent signing key."
          else
            echo "USE_TEST_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Restore the temporary test key
        if: env.USE_TEST_KEY == '1'
        uses: actions/cache/restore@v4
        with:
          path: ~/tf-test-key
          key: tf-voice-typer-test-key-v1

      - name: Create the temporary test key (first time only)
        if: env.USE_TEST_KEY == '1'
        run: |
          mkdir -p ~/tf-test-key
          if [ ! -f ~/tf-test-key/test.keystore ]; then
            keytool -genkeypair -keystore ~/tf-test-key/test.keystore -storetype JKS \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TF Voice Typer Test, O=Taiful, C=BD"
            echo "NEW_TEST_KEY=1" >> "$GITHUB_ENV"
          fi
          echo "TF_TEST_KEYSTORE=$HOME/tf-test-key/test.keystore" >> "$GITHUB_ENV"

      - name: Save the temporary test key
        if: env.NEW_TEST_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/tf-test-key
          key: tf-voice-typer-test-key-v1

      - name: Build the APK
        env:
          TF_KEY_PASSWORD: ${{ secrets.TF_KEY_PASSWORD }}
          TF_KEY_ALIAS: ${{ secrets.TF_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease -Pvc=${{ github.run_number }} --no-daemon 2>&1 | tee build.log; then
            grep -E "^e: |What went wrong|error:|ERROR" build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk TF-Voice-Typer.apk
          ls -la TF-Voice-Typer.apk

      - name: Write version.json (read by the app's built-in updater)
        env:
          VC: ${{ github.run_number }}
        run: |
          # What's new (shown in the app's update popup): first lines of release-notes.txt
          NOTES="$(head -c 300 release-notes.txt 2>/dev/null || echo 'নতুন উন্নতি ও সমস্যার সমাধান')"
          export NOTES
          python3 - <<'PY'
          import hashlib, json, os
          apk = "TF-Voice-Typer.apk"
          data = open(apk, "rb").read()
          vc = int(os.environ["VC"])
          json.dump({
              "versionCode": vc,
              "versionName": f"1.0.{vc}",
              "notes": os.environ.get("NOTES", ""),
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
          }, open("version.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          cat version.json

      - name: Keep the APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: TF-Voice-Typer-apk
          path: TF-Voice-Typer.apk

      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TF-Voice-Typer.apk version.json --latest \
            --title "TF Voice Typer — Android app (build ${{ github.run_number }})" \
            --notes "ফোনে ইনস্টল করতে নিচের TF-Voice-Typer.apk ফাইলটি ডাউনলোড করে খুলুন। (Build ${{ github.run_number }})"
